[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpr"
version = "0.1.0"
description = "ALPR Colombia — automatic recognition of Colombian particular plates for gate access control"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Dependencies arrive with the phase that needs them. PyTorch arrives in Phase 4.
dependencies = [
    # Phase 1 — every module under alpr/data_sources/ imports these lazily, inside
    # the function that needs them, so its tests run on the standard library.
    "requests>=2.31",
    "tqdm>=4.66",
    "gdown>=5.1",
    "yt-dlp>=2024.1",
    # Phase 2 — image arrays, homography, decoding. BSD-3 and Apache-2.0.
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
acquire = "alpr.data_sources.acquire:main"
annotate = "alpr.plates.annotate:main"
generate = "alpr.synth.generate:main"

[tool.hatch.build.targets.wheel]
packages = ["alpr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
